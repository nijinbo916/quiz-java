# ============================================================
# Quiz 系统 Nginx 配置（VirtualBox Ubuntu 用）
# 放到 /etc/nginx/conf.d/quiz.conf 后 sudo nginx -t && sudo systemctl reload nginx
# ------------------------------------------------------------
# 布局（对应验收条件书第 2 条）：
#   8081  管理端前端（Vue dist，/var/www/quiz-admin）
#   80    用户端前端（html/css/js，/var/www/quiz-user）
#   8080  Java 后端（jar 包，nohup 运行）
# 两个前端的接口请求都走各自 server 块里的反向代理转发到 8080 —— 同源，
# 不产生跨域；跨域由 Nginx 负责，Java 后端不需要任何 CORS 设置。
# ============================================================

# ---------- 管理端前端（8081） ----------
server {
    listen 8081;
    server_name localhost;

    root /var/www/quiz-admin;
    index index.html;

    # Vue hash 路由：找到文件就返回，找不到回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理端用到的接口，反向代理到本机 8080 的 Java 后端
    location ~ ^/(login|register|addUser|resetPassword|users|findUser|deleteById|deleteByName|hardDelete|addQuestion|updateQuestion|delQuestion|getQuestion|questions|findQuestion|hello)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ---------- 用户端前端（80） ----------
server {
    listen 80;
    server_name localhost;

    root /var/www/quiz-user;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 用户端用到的接口（login / register / getQuestion），同样代理到 8080
    location ~ ^/(login|register|getQuestion)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
